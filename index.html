<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#1d130c;overflow:hidden;font-family:"Arial Black","Arial Rounded MT Bold",Impact,sans-serif;touch-action:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#c{display:block;background:#9fe0f2}
#ui{position:absolute;pointer-events:none}
#menu{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*12);background:rgba(20,40,20,.45);pointer-events:auto;padding:calc(var(--u)*14)}
#menu.show{display:flex}
.title{display:flex;flex-direction:column;align-items:center;line-height:.95;transform:rotate(-2deg)}
.title span{color:#ffd23a;-webkit-text-stroke:calc(var(--u)*3) #1d130c;paint-order:stroke fill;text-shadow:calc(var(--u)*5) calc(var(--u)*5) 0 #1d130c}
.t1{font-size:calc(var(--u)*58);color:#ffd23a!important}.t2{font-size:calc(var(--u)*44);color:#ff6a2a!important}
.h{font-size:calc(var(--u)*44);color:#ffd23a;-webkit-text-stroke:calc(var(--u)*2.5) #1d130c;paint-order:stroke fill;text-shadow:calc(var(--u)*4) calc(var(--u)*4) 0 #1d130c}
.heroes{display:flex;align-items:flex-end;gap:calc(var(--u)*10);filter:drop-shadow(calc(var(--u)*3) calc(var(--u)*4) 0 rgba(0,0,0,.35))}
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(var(--u)*10);max-width:calc(var(--u)*720)}
.b{font:inherit;font-size:calc(var(--u)*20);padding:calc(var(--u)*10) calc(var(--u)*22);border:calc(var(--u)*3.5) solid #1d130c;border-radius:calc(var(--u)*16);background:#fff3d0;color:#1d130c;box-shadow:0 calc(var(--u)*5) 0 #1d130c;cursor:pointer}
.b.big{background:#ffd23a;font-size:calc(var(--u)*24)}
.b:active{transform:translateY(calc(var(--u)*4));box-shadow:0 calc(var(--u)*1) 0 #1d130c}
.back{position:absolute;left:calc(var(--u)*16);top:calc(var(--u)*14);font-size:calc(var(--u)*16)}
.snd{position:absolute;right:calc(var(--u)*16);top:calc(var(--u)*14);font-size:calc(var(--u)*26);background:#fff3d0;border:calc(var(--u)*3) solid #1d130c;border-radius:50%;width:calc(var(--u)*52);height:calc(var(--u)*52);cursor:pointer}
.hint{font-family:Arial,sans-serif;font-weight:bold;font-size:calc(var(--u)*13);color:#fff;text-shadow:0 1px 3px #000;text-align:center}
.cards{display:flex;gap:calc(var(--u)*24);align-items:stretch}
.card{font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:calc(var(--u)*6);background:var(--c);border:calc(var(--u)*4) solid #1d130c;border-radius:calc(var(--u)*22);padding:calc(var(--u)*14) calc(var(--u)*26);box-shadow:0 calc(var(--u)*7) 0 #1d130c;cursor:pointer;min-width:calc(var(--u)*220)}
.card.sm{min-width:calc(var(--u)*180);flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:flex-end}
.card.sm span{width:100%;text-align:center}
.card span{font-size:calc(var(--u)*28);color:#fff;-webkit-text-stroke:calc(var(--u)*2) #1d130c;paint-order:stroke fill}
.card:active{transform:translateY(calc(var(--u)*5));box-shadow:0 calc(var(--u)*2) 0 #1d130c}
.lv .card{min-width:calc(var(--u)*230);justify-content:center}
.lvl b{font-size:calc(var(--u)*60);color:#fff;-webkit-text-stroke:calc(var(--u)*3) #1d130c;paint-order:stroke fill}
.lvl small{font-family:Arial,sans-serif;font-weight:bold;font-size:calc(var(--u)*14);color:#1d130c;background:rgba(255,255,255,.7);border-radius:calc(var(--u)*8);padding:calc(var(--u)*2) calc(var(--u)*8)}
.locked{filter:grayscale(1) brightness(.7);cursor:default}
.coll{display:flex;gap:calc(var(--u)*16);max-height:calc(var(--u)*400)}
.panel{background:#fff3d0;border:calc(var(--u)*4) solid #1d130c;border-radius:calc(var(--u)*18);padding:calc(var(--u)*12);width:calc(var(--u)*430);overflow:auto;box-shadow:0 calc(var(--u)*6) 0 #1d130c}
.ph{font-size:calc(var(--u)*20);color:#ff6a2a;-webkit-text-stroke:calc(var(--u)*1) #1d130c;margin-bottom:calc(var(--u)*8)}
.erow{display:flex;flex-direction:column;margin-bottom:calc(var(--u)*10);font-size:calc(var(--u)*15)}
.egg{height:calc(var(--u)*36);margin-right:calc(var(--u)*2)}.egg.dim{filter:brightness(0) opacity(.25)}
.small{font-family:Arial,sans-serif;font-weight:bold;font-size:calc(var(--u)*13)}
.ach{display:flex;flex-direction:column;gap:calc(var(--u)*5)}
.ach div{opacity:.45;font-size:calc(var(--u)*14);display:flex;flex-direction:column}.ach div.on{opacity:1;color:#1f7a1a}
.ach small{font-family:Arial,sans-serif;font-weight:bold;font-size:calc(var(--u)*12);color:#555}
.stats{font-size:calc(var(--u)*22);color:#fff;-webkit-text-stroke:calc(var(--u)*1.2) #1d130c;paint-order:stroke fill;text-align:center}
.award{font-size:calc(var(--u)*26);color:#ffd23a;-webkit-text-stroke:calc(var(--u)*1.5) #1d130c;paint-order:stroke fill}
#pauseBtn{position:absolute;right:calc(var(--u)*6);top:calc(var(--u)*72);width:calc(var(--u)*46);height:calc(var(--u)*46);border-radius:50%;background:#fff3d0;border:calc(var(--u)*3) solid #1d130c;display:none;align-items:center;justify-content:center;font-size:calc(var(--u)*20);pointer-events:auto;cursor:pointer;color:#1d130c}
#touch{position:absolute;inset:0;display:none;pointer-events:none}
.tb{position:absolute;pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;border:calc(var(--u)*4) solid rgba(29,19,12,.85);background:rgba(255,243,208,.4);border-radius:50%;color:#1d130c;font-size:calc(var(--u)*34)}
.tb.on{background:rgba(255,210,58,.9);transform:scale(.94)}
.pad{position:absolute;bottom:calc(var(--u)*14);width:calc(var(--u)*250);height:calc(var(--u)*120)}
.pad.left{left:calc(var(--u)*14)}.pad.right{right:calc(var(--u)*14)}
.pad .tb{width:calc(var(--u)*112);height:calc(var(--u)*112);bottom:0}
.pad.left .tb:nth-child(1){left:0}.pad.left .tb:nth-child(2){left:calc(var(--u)*130)}
.pad.right .fire{left:0;bottom:calc(var(--u)*20);width:calc(var(--u)*96);height:calc(var(--u)*96);background:rgba(255,120,60,.6)}
.pad.right .jump{right:0;font-size:calc(var(--u)*22);background:rgba(125,211,106,.6)}
.pad2{position:absolute;bottom:calc(var(--u)*6);width:calc(var(--u)*170);height:calc(var(--u)*170)}
.pad2.p1{left:calc(var(--u)*8)}.pad2.p2{right:calc(var(--u)*8)}
.pad2 .lbl{position:absolute;top:calc(var(--u)*-22);left:0;right:0;text-align:center;color:var(--c);font-size:calc(var(--u)*15);-webkit-text-stroke:calc(var(--u)*1) #1d130c;paint-order:stroke fill}
.pad2 .tb{width:calc(var(--u)*78);height:calc(var(--u)*78);font-size:calc(var(--u)*26);border-color:var(--c);opacity:.8}
.pad2 .tb:nth-of-type(2){left:0;top:0;background:rgba(255,120,60,.55)}
.pad2 .tb:nth-of-type(3){right:0;top:0;background:rgba(125,211,106,.55)}
.pad2 .tb:nth-of-type(4){left:0;bottom:0}
.pad2 .tb:nth-of-type(5){right:0;bottom:0}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#2f6a22;color:#ffd23a;font-size:28px;text-align:center;z-index:8;-webkit-text-stroke:1px #1d130c}
#rot{display:none;position:fixed;inset:0;background:#1d130c;color:#ffd23a;font-size:28px;align-items:center;justify-content:center;text-align:center;z-index:9;padding:30px}
@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}

    touchEl.innerHTML = `<div class="pad left">${btn(0, 'l', '◀', 'mv')}${btn(0, 'r', '▶', 'mv')}</div>
      <div class="pad right">${btn(0, 'f', '🔥', 'fire')}${btn(0, 'j', 'JUMP', 'jump')}</div>`;
  } else {
    touchEl.innerHTML = `<div class="pad2 p1" style="--c:${CH.linus.col}"><div class="lbl">LINUS</div>${btn(0, 'f', '🔥', 'sm')}${btn(0, 'j', '⤒', 'sm')}${btn(0, 'l', '◀', 'sm')}${btn(0, 'r', '▶', 'sm')}</div>
      <div class="pad2 p2" style="--c:${CH.wesley.col}"><div class="lbl">WESLEY</div>${btn(1, 'f', '🔥', 'sm')}${btn(1, 'j', '⤒', 'sm')}${btn(1, 'l', '◀', 'sm')}${btn(1, 'r', '▶', 'sm')}</div>`;
  }
}
/* Input from both Pointer Events and Touch Events, merged, so controls work in Safari, the Claude app and Home Screen web apps */
const PTR = new Map(); let TOUCHLIST = [];
function btnAt(x, y) { const el = document.elementFromPoint(x, y); return el && el.closest ? el.closest('.tb') : null; }
function syncTouch() {
  TOUCH[0] = {}; TOUCH[1] = {};
  touchEl.querySelectorAll('.tb.on').forEach(b => b.classList.remove('on'));
  if (!G || touchEl.style.display === 'none') return;
  const els = [...PTR.values(), ...TOUCHLIST.map(t => btnAt(t.x, t.y))];
  for (const el of els) if (el && el.dataset.k) { TOUCH[el.dataset.p][el.dataset.k] = true; el.classList.add('on'); }
}
function inGame() { return G && !menu.classList.contains('show'); }
let pauseAt = 0;
function pausePress() { const n = performance.now(); if (n - pauseAt < 400) return; pauseAt = n; PTR.clear(); TOUCHLIST = []; syncTouch(); initAudio(); togglePause(); }
document.addEventListener('pointerdown', e => {
  initAudio();
  if (!inGame()) return;
  const t = e.target;
  if (t && t.closest && t.closest('#pauseBtn')) { e.preventDefault(); pausePress(); return; }
  const el = btnAt(e.clientX, e.clientY);
  if (el) { e.preventDefault(); try { el.releasePointerCapture && el.releasePointerCapture(e.pointerId); } catch (_) { } PTR.set(e.pointerId, el); syncTouch(); }
}, { passive: false });
document.addEventListener('pointermove', e => { if (PTR.has(e.pointerId)) { PTR.set(e.pointerId, btnAt(e.clientX, e.clientY)); syncTouch(); } });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => document.addEventListener(ev, e => { if (ev === 'lostpointercapture') return; if (PTR.delete(e.pointerId)) syncTouch(); }));
['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(ev => document.addEventListener(ev, e => {
  initAudio();
  if (!inGame()) { TOUCHLIST = []; return; }
  if (ev === 'touchstart') for (const t of e.changedTouches) { const el = document.elementFromPoint(t.clientX, t.clientY); if (el && el.closest && el.closest('#pauseBtn')) { if (e.cancelable) e.preventDefault(); pausePress(); return; } }
  if (e.cancelable) e.preventDefault();
  TOUCHLIST = [...e.touches].map(t => ({ x: t.clientX, y: t.clientY }));
  syncTouch();
}, { passive: false }));
document.addEventListener('gesturestart', e => e.preventDefault());

/* ---------- boot ---------- */
let lastT = 0;
function loop(ts) {
  const dt = Math.min(.033, Math.max(0, (ts - lastT) / 1000)); lastT = ts;
  if (G && (G.state === 'play' || G.state === 'complete' || G.state === 'over')) update(dt);
  render();
  requestAnimationFrame(loop);
}
(function boot() {
  const keys = Object.keys(SPR); let n = 0;
  keys.forEach(k => { const im = new Image(); im.onload = im.onerror = () => { if (++n === keys.length) ready(); }; im.src = SPR[k].d; IMG[k] = im; });
  function ready() {
    keys.filter(k => k[0] === 'd').forEach(k => BOSSIMG[k] = tintBoss(IMG[k]));
    buildArt(); const ld = document.getElementById('loading'); if (ld) ld.remove(); mainMenu(); requestAnimationFrame(loop);
    document.addEventListener('pointerdown', initAudio, { once: false });
  }
})();

$('#pauseBtn').addEventListener('click', () => pausePress());
